<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>المنتجات | متجرك الإلكتروني</title>
  <link rel="icon" href="assets/logo/logo.png">
  <link rel="stylesheet" href="css/style.css?v=34">
  <style>
  /* شريط التبويبات العلوي للأقسام السلس */
  .shop-cat-tabs-wrap {
    overflow-x: auto;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px 0 14px;
    margin-bottom: 10px;
    display: flex;
    gap: 8px;
  }
  .shop-cat-tabs-wrap::-webkit-scrollbar { display: none; }
  
  .shop-tab-btn {
    flex: 0 0 auto;
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-700);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.22s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .shop-tab-btn:hover {
    border-color: var(--olive-500);
    background: var(--olive-50);
  }
  .shop-tab-btn.active {
    background: var(--olive-700);
    color: #fff;
    border-color: var(--olive-700);
    box-shadow: 0 4px 12px rgba(13, 81, 68, 0.2);
  }

  /* انتقال ناعم لشبكة المنتجات */
  #shopGrid {
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #shopGrid.is-updating {
    opacity: 0.4;
    transform: translateY(4px);
  }

  @media (max-width: 768px) {
    .product-grid, #shopGrid {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 8px !important;
    }
    .product-card {
      min-width: 0 !important;
      padding: 8px !important;
    }
    .product-card .product-name { font-size: 12px !important; margin-bottom: 4px !important; line-height: 1.4 !important; }
    .product-card .product-desc { display: none !important; } 
    .product-card .stock-line { font-size: 10px !important; margin-bottom: 4px !important; }
    .product-card .price { font-size: 13px !important; margin: 6px 0 !important; }
    .product-card .product-actions .btn { padding: 6px !important; font-size: 11px !important; }
  }
  </style>
</head>
<body>

<div id="site-header" data-active="products"></div>

<main>
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">الرئيسية</a> / المنتجات</div>
      <h1>كل المنتجات</h1>
      <p>تصفّح مجموعتنا الكاملة من المنتجات بسلاسة وسرعة فائقة.</p>
    </div>
  </section>

  <section class="section" style="padding-top:15px;">
    <div class="container">

      <!-- شريط البحث والترتيب -->
      <div class="shop-toolbar" style="margin-bottom: 12px;">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
          <span></span>
        </div>
        <select id="sortSelect" class="sort-select">
          <option value="default">الأحدث</option>
          <option value="price-asc">السعر: من الأقل للأعلى</option>
          <option value="price-desc">السعر: من الأعلى للأقل</option>
          <option value="name">الاسم (أ-ي)</option>
        </select>
        <span id="resultCount" style="font-size:.85rem;color:var(--ink-600);white-space:nowrap;"></span>
      </div>

      <!-- شريط تبويبات الأقسام السلس والسريع (Pills Bar) -->
      <div class="shop-cat-tabs-wrap" id="filterCategories"></div>

      <!-- شبكة المنتجات المباشرة -->
      <div class="product-grid" id="shopGrid"></div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js?v=28"></script>
<script src="js/icons.js?v=28"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/store.js?v=29"></script>
<script src="js/whatsapp.js?v=28"></script>
<script src="js/app.js?v=29"></script>
<script src="js/products.js?v=30"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const shopSearchSpan = document.querySelector(".shop-toolbar .search-box span");
    if (shopSearchSpan && typeof iconSvg === "function") {
      shopSearchSpan.innerHTML = iconSvg("search");
    }
  });
</script>
</body>
</html>
